name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Fetch a piper voice (offline neural engine for the e2e tests)
        run: python scripts/download_voice.py

      - name: Lint
        run: ruff check .

      - name: Tests
        # End-to-end tests render real audio with piper; the ones that need ffmpeg
        # or a voice model skip themselves when those are unavailable.
        run: python -m pytest tests -q
